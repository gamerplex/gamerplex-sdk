<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamerplex — Reaction Duel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a28;
    --border: #2a2a3a;
    --text: #e0e0e8;
    --dim: #6a6a80;
    --accent: #ff6b35;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #a855f7;
    --yellow: #eab308;
    --cyan: #06b6d4;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    padding: 24px 16px 8px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--yellow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .sub {
    color: var(--dim);
    font-size: 13px;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
  }

  /* --- Config Panel --- */
  .config {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }
  .config label {
    font-size: 12px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .config select, .config input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .config .group { display: flex; flex-direction: column; gap: 4px; }

  /* --- Arena --- */
  .arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    margin-bottom: 16px;
    align-items: start;
  }

  .player-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    transition: border-color 0.3s, box-shadow 0.3s;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .player-card.winner {
    border-color: var(--green);
    box-shadow: 0 0 30px rgba(34, 197, 94, 0.15);
  }
  .player-card.loser {
    border-color: var(--red);
    opacity: 0.6;
  }
  .player-card .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .player-card .name {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .player-card .type-badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .type-badge.human { background: var(--blue); color: white; }
  .type-badge.agent { background: var(--purple); color: white; }

  .player-card .reaction-zone {
    height: 60px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    margin-top: 8px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .reaction-zone.waiting { background: var(--surface2); color: var(--dim); }
  .reaction-zone.ready { background: var(--yellow); color: #000; animation: pulse 0.5s infinite; }
  .reaction-zone.go { background: var(--green); color: #000; }
  .reaction-zone.done { background: var(--surface2); color: var(--green); }
  .reaction-zone.early { background: var(--red); color: white; }
  .reaction-zone.disabled { background: var(--surface2); color: var(--dim); cursor: default; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .vs {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    padding-top: 60px;
  }

  /* --- Stake Display --- */
  .stake-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
  }
  .stake-bar .pot {
    font-size: 20px;
    font-weight: 700;
    color: var(--yellow);
  }
  .stake-bar .fee {
    font-size: 12px;
    color: var(--dim);
  }

  /* --- Action Button --- */
  .actions {
    text-align: center;
    margin-bottom: 16px;
  }
  .btn {
    background: linear-gradient(135deg, var(--accent), #ff8f35);
    color: white;
    border: none;
    padding: 14px 40px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:hover { transform: scale(1.02); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* --- Transaction Log --- */
  .log-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .log-header {
    padding: 10px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
  }
  .log-header .chain {
    color: var(--cyan);
  }
  .log {
    padding: 12px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.8;
    max-height: 280px;
    overflow-y: auto;
  }
  .log .line { opacity: 0; animation: fadeIn 0.3s forwards; }
  .log .line.tx { color: var(--cyan); }
  .log .line.fee { color: var(--yellow); }
  .log .line.win { color: var(--green); font-weight: 700; }
  .log .line.err { color: var(--red); }
  .log .line.dim { color: var(--dim); }
  .log .line .sig {
    color: var(--purple);
    font-size: 10px;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  /* --- Result Overlay --- */
  .result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .result-overlay.show { display: flex; }
  .result-overlay .winner-text {
    font-size: 48px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .result-overlay .payout-text {
    font-size: 20px;
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 24px;
  }
  .result-overlay .btn { background: var(--surface2); }

  /* --- Responsive --- */
  @media (max-width: 600px) {
    .arena { grid-template-columns: 1fr; }
    .vs { padding: 8px 0; font-size: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>GAMERPLEX</h1>
  <div class="sub">Reaction Duel &mdash; Wagered on Contention Markets (Solana)</div>
</div>

<div class="container">

  <!-- Config -->
  <div class="config">
    <div class="group">
      <label>Player 1</label>
      <select id="p1Type">
        <option value="human">Human (You)</option>
        <option value="agent">AI Agent</option>
      </select>
    </div>
    <div class="group">
      <label>Player 2</label>
      <select id="p2Type">
        <option value="agent" selected>AI Agent</option>
        <option value="human">Human (Click)</option>
      </select>
    </div>
    <div class="group">
      <label>Stake (USDC)</label>
      <input type="number" id="stakeInput" value="5.00" min="0.01" step="0.01" style="width:90px">
    </div>
  </div>

  <!-- Arena -->
  <div class="arena">
    <div class="player-card" id="p1Card">
      <div class="avatar" style="background:var(--blue)">P1</div>
      <div class="name" id="p1Name">You</div>
      <div><span class="type-badge human" id="p1Badge">HUMAN</span></div>
      <div class="reaction-zone waiting" id="p1Zone">Waiting...</div>
    </div>
    <div class="vs">VS</div>
    <div class="player-card" id="p2Card">
      <div class="avatar" style="background:var(--purple)">P2</div>
      <div class="name" id="p2Name">Agent-007</div>
      <div><span class="type-badge agent" id="p2Badge">AI AGENT</span></div>
      <div class="reaction-zone disabled" id="p2Zone">Autonomous</div>
    </div>
  </div>

  <!-- Stake Bar -->
  <div class="stake-bar">
    <div>
      <span style="color:var(--dim);font-size:12px">TOTAL POT</span><br>
      <span class="pot" id="potDisplay">$0.00</span>
    </div>
    <div style="text-align:right">
      <span class="fee">2% Protocol Fee &rarr; Contention Treasury</span><br>
      <span class="fee">Winner takes <span id="winnerTakeDisplay">$0.00</span></span>
    </div>
  </div>

  <!-- Action -->
  <div class="actions">
    <button class="btn" id="startBtn" onclick="startMatch()">Start Match</button>
  </div>

  <!-- Transaction Log -->
  <div class="log-container">
    <div class="log-header">
      <span>Contention Markets &mdash; Transaction Log</span>
      <span class="chain">Solana Devnet</span>
    </div>
    <div class="log" id="txLog"></div>
  </div>

</div>

<!-- Result Overlay -->
<div class="result-overlay" id="resultOverlay">
  <div class="winner-text" id="resultWinner"></div>
  <div class="payout-text" id="resultPayout"></div>
  <button class="btn" onclick="resetMatch()">Play Again</button>
</div>

<script>
// =========================================================================
// Simulated Solana addresses
// =========================================================================
function randomSig() {
  const chars = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  let s = '';
  for (let i = 0; i < 88; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function shortSig(s) { return s.slice(0, 8) + '...' + s.slice(-4); }
function randomPubkey() { return randomSig().slice(0, 44); }

const PARTNER = randomPubkey();
const P1_WALLET = randomPubkey();
const P2_WALLET = randomPubkey();
const MARKET_PDA = randomPubkey();
const VAULT_PDA = randomPubkey();
const MINT = 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';

// =========================================================================
// State
// =========================================================================
let phase = 'idle'; // idle | depositing | waiting | ready | go | resolved
let p1Time = null;
let p2Time = null;
let goTimestamp = null;
let readyTimeout = null;
let goTimeout = null;

// =========================================================================
// UI Helpers
// =========================================================================
const $ = (id) => document.getElementById(id);
const log = (text, cls = '') => {
  const el = document.createElement('div');
  el.className = 'line ' + cls;
  el.innerHTML = text;
  $('txLog').appendChild(el);
  $('txLog').scrollTop = $('txLog').scrollHeight;
};

function updatePot() {
  const stake = parseFloat($('stakeInput').value) || 0;
  const pot = stake * 2;
  const fee = pot * 0.02;
  $('potDisplay').textContent = `$${pot.toFixed(2)}`;
  $('winnerTakeDisplay').textContent = `$${(pot - fee).toFixed(2)}`;
}

function updatePlayerCards() {
  const p1Human = $('p1Type').value === 'human';
  const p2Human = $('p2Type').value === 'human';

  $('p1Name').textContent = p1Human ? 'You' : 'Agent-Alpha';
  $('p1Badge').textContent = p1Human ? 'HUMAN' : 'AI AGENT';
  $('p1Badge').className = 'type-badge ' + (p1Human ? 'human' : 'agent');
  $('p1Zone').style.cursor = p1Human ? 'pointer' : 'default';

  $('p2Name').textContent = p2Human ? 'You (P2)' : 'Agent-007';
  $('p2Badge').textContent = p2Human ? 'HUMAN' : 'AI AGENT';
  $('p2Badge').className = 'type-badge ' + (p2Human ? 'human' : 'agent');
  $('p2Zone').style.cursor = p2Human ? 'pointer' : 'default';
}

$('p1Type').onchange = updatePlayerCards;
$('p2Type').onchange = updatePlayerCards;
$('stakeInput').oninput = updatePot;
updatePot();

// =========================================================================
// Agent AI: simulate reaction time (150-350ms, sometimes early)
// =========================================================================
function agentReact() {
  const skill = 180 + Math.random() * 150; // 180-330ms
  return Math.round(skill);
}

// =========================================================================
// Match Lifecycle
// =========================================================================
async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startMatch() {
  if (phase !== 'idle') return;
  phase = 'depositing';

  $('startBtn').disabled = true;
  $('txLog').innerHTML = '';
  $('p1Card').className = 'player-card';
  $('p2Card').className = 'player-card';
  p1Time = null;
  p2Time = null;

  const stake = parseFloat($('stakeInput').value) || 5;
  const stakeRaw = Math.round(stake * 1_000_000);
  const pot = stake * 2;
  const fee = pot * 0.02;

  // --- Phase 1: Initialize Market ---
  log(`<span class="dim">[${time()}]</span> GameSession.create() ...`);
  await sleep(300);

  const initSig = randomSig();
  log(`<span class="dim">[${time()}]</span> <span class="tx">initialize_market</span> event_id=${Date.now()}`);
  log(`&nbsp;&nbsp;market: ${shortSig(MARKET_PDA)}`);
  log(`&nbsp;&nbsp;vault:  ${shortSig(VAULT_PDA)}`);
  log(`&nbsp;&nbsp;p1: ${shortSig(P1_WALLET)} | p2: ${shortSig(P2_WALLET)}`);
  log(`&nbsp;&nbsp;<span class="sig">tx: ${shortSig(initSig)}</span>`);
  await sleep(400);

  // --- Phase 2: Deposits ---
  const dep1Sig = randomSig();
  log(`<span class="dim">[${time()}]</span> <span class="tx">deposit</span> P1 stakes ${stake.toFixed(2)} USDC`);
  log(`&nbsp;&nbsp;<span class="sig">tx: ${shortSig(dep1Sig)}</span>`);
  await sleep(300);

  const dep2Sig = randomSig();
  log(`<span class="dim">[${time()}]</span> <span class="tx">deposit</span> P2 stakes ${stake.toFixed(2)} USDC`);
  log(`&nbsp;&nbsp;<span class="sig">tx: ${shortSig(dep2Sig)}</span>`);
  await sleep(300);

  log(`<span class="dim">[${time()}]</span> Vault balance: <span class="fee">${pot.toFixed(2)} USDC</span> | Both players funded`);
  updatePot();
  await sleep(500);

  // --- Phase 3: The Game ---
  log(`<span class="dim">[${time()}]</span> Match starting...`);

  const p1Human = $('p1Type').value === 'human';
  const p2Human = $('p2Type').value === 'human';

  // Show "waiting" state
  phase = 'waiting';
  $('p1Zone').className = 'reaction-zone ready';
  $('p1Zone').textContent = p1Human ? 'Get ready...' : 'Calibrating...';
  $('p2Zone').className = 'reaction-zone ready';
  $('p2Zone').textContent = p2Human ? 'Get ready...' : 'Calibrating...';

  // Random delay before "GO"
  const delay = 1500 + Math.random() * 2500;
  await sleep(delay);

  // GO!
  phase = 'go';
  goTimestamp = performance.now();

  $('p1Zone').className = 'reaction-zone go';
  $('p1Zone').textContent = p1Human ? 'CLICK NOW!' : 'Reacting...';
  $('p2Zone').className = 'reaction-zone go';
  $('p2Zone').textContent = p2Human ? 'CLICK NOW!' : 'Reacting...';

  // AI agents react automatically
  if (!p1Human) {
    const t = agentReact();
    setTimeout(() => {
      if (phase === 'go' && p1Time === null) {
        p1Time = t;
        $('p1Zone').className = 'reaction-zone done';
        $('p1Zone').textContent = `${t}ms`;
        checkBothDone(stake);
      }
    }, t);
  }

  if (!p2Human) {
    const t = agentReact();
    setTimeout(() => {
      if (phase === 'go' && p2Time === null) {
        p2Time = t;
        $('p2Zone').className = 'reaction-zone done';
        $('p2Zone').textContent = `${t}ms`;
        checkBothDone(stake);
      }
    }, t);
  }

  // Timeout: if human doesn't click within 3s
  goTimeout = setTimeout(() => {
    if (p1Human && p1Time === null) {
      p1Time = 9999;
      $('p1Zone').className = 'reaction-zone early';
      $('p1Zone').textContent = 'Too slow!';
    }
    if (p2Human && p2Time === null) {
      p2Time = 9999;
      $('p2Zone').className = 'reaction-zone early';
      $('p2Zone').textContent = 'Too slow!';
    }
    checkBothDone(stake);
  }, 3000);
}

// Human click handlers
$('p1Zone').addEventListener('click', () => {
  if ($('p1Type').value !== 'human') return;
  if (phase === 'waiting') {
    // Clicked too early!
    p1Time = -1;
    $('p1Zone').className = 'reaction-zone early';
    $('p1Zone').textContent = 'Too early!';
    phase = 'go'; // Let the game continue for P2
    // Auto-lose
    setTimeout(() => {
      if (p2Time === null) {
        p2Time = $('p2Type').value === 'human' ? 9999 : agentReact();
        $('p2Zone').className = 'reaction-zone done';
        $('p2Zone').textContent = `${p2Time}ms`;
      }
      checkBothDone(parseFloat($('stakeInput').value) || 5);
    }, 500);
    return;
  }
  if (phase !== 'go' || p1Time !== null) return;
  p1Time = Math.round(performance.now() - goTimestamp);
  $('p1Zone').className = 'reaction-zone done';
  $('p1Zone').textContent = `${p1Time}ms`;
  checkBothDone(parseFloat($('stakeInput').value) || 5);
});

$('p2Zone').addEventListener('click', () => {
  if ($('p2Type').value !== 'human') return;
  if (phase === 'waiting') {
    p2Time = -1;
    $('p2Zone').className = 'reaction-zone early';
    $('p2Zone').textContent = 'Too early!';
    phase = 'go';
    setTimeout(() => {
      if (p1Time === null) {
        p1Time = $('p1Type').value === 'human' ? 9999 : agentReact();
        $('p1Zone').className = 'reaction-zone done';
        $('p1Zone').textContent = `${p1Time}ms`;
      }
      checkBothDone(parseFloat($('stakeInput').value) || 5);
    }, 500);
    return;
  }
  if (phase !== 'go' || p2Time !== null) return;
  p2Time = Math.round(performance.now() - goTimestamp);
  $('p2Zone').className = 'reaction-zone done';
  $('p2Zone').textContent = `${p2Time}ms`;
  checkBothDone(parseFloat($('stakeInput').value) || 5);
});

async function checkBothDone(stake) {
  if (p1Time === null || p2Time === null) return;
  if (phase === 'resolved') return;
  phase = 'resolved';
  clearTimeout(goTimeout);

  await sleep(600);

  const pot = stake * 2;
  const fee = pot * 0.02;
  const partnerFee = fee * 0.5;
  const contentionFee = fee - partnerFee;
  const payout = pot - fee;

  // Determine winner (lower time wins, -1 = early = auto-lose, 9999 = timeout)
  let winner;
  const p1Valid = p1Time > 0 && p1Time < 9999;
  const p2Valid = p2Time > 0 && p2Time < 9999;

  if (p1Valid && p2Valid) {
    winner = p1Time <= p2Time ? 0 : 1;
  } else if (p1Valid) {
    winner = 0;
  } else if (p2Valid) {
    winner = 1;
  } else {
    winner = 255; // Both failed — cancel
  }

  // --- Phase 4: Resolution ---
  log('');
  if (winner === 255) {
    log(`<span class="dim">[${time()}]</span> <span class="tx">resolve_market</span> outcome=CANCELLED (255)`);
    log(`&nbsp;&nbsp;<span class="fee">Both players failed. Refunding deposits.</span>`);
  } else {
    const winnerName = winner === 0 ? 'P1' : 'P2';
    const winTime = winner === 0 ? p1Time : p2Time;
    log(`<span class="dim">[${time()}]</span> <span class="tx">resolve_market</span> outcome=${winner} (${winnerName} wins)`);
    log(`&nbsp;&nbsp;${winnerName} reacted in <span class="win">${winTime}ms</span>`);
  }

  const resolveSig = randomSig();
  await sleep(200);

  if (winner !== 255) {
    log(`&nbsp;&nbsp;<span class="fee">Protocol fee: ${fee.toFixed(4)} USDC (${partnerFee.toFixed(4)} partner + ${contentionFee.toFixed(4)} contention)</span>`);
    log(`&nbsp;&nbsp;<span class="win">Winner payout: ${payout.toFixed(2)} USDC</span>`);
  }
  log(`&nbsp;&nbsp;<span class="sig">tx: ${shortSig(resolveSig)}</span>`);
  await sleep(300);

  // Close market
  const closeSig = randomSig();
  log(`<span class="dim">[${time()}]</span> <span class="tx">close_market</span> rent reclaimed: 0.005 SOL`);
  log(`&nbsp;&nbsp;<span class="sig">tx: ${shortSig(closeSig)}</span>`);
  await sleep(200);
  log(`<span class="dim">[${time()}]</span> Match complete. Vault empty. Market closed.`);

  // UI
  if (winner === 0) {
    $('p1Card').classList.add('winner');
    $('p2Card').classList.add('loser');
  } else if (winner === 1) {
    $('p2Card').classList.add('winner');
    $('p1Card').classList.add('loser');
  }

  await sleep(800);

  // Show overlay
  if (winner !== 255) {
    const wName = winner === 0 ? $('p1Name').textContent : $('p2Name').textContent;
    const wType = winner === 0 ? $('p1Type').value : $('p2Type').value;
    $('resultWinner').textContent = `${wName} wins!`;
    $('resultWinner').style.color = winner === 0 ? 'var(--blue)' : 'var(--purple)';
    $('resultPayout').textContent = `+${payout.toFixed(2)} USDC`;
    $('resultOverlay').classList.add('show');
  } else {
    $('startBtn').disabled = false;
    phase = 'idle';
  }
}

function resetMatch() {
  phase = 'idle';
  p1Time = null;
  p2Time = null;
  $('resultOverlay').classList.remove('show');
  $('startBtn').disabled = false;
  $('p1Card').className = 'player-card';
  $('p2Card').className = 'player-card';
  $('p1Zone').className = 'reaction-zone waiting';
  $('p1Zone').textContent = 'Waiting...';
  $('p2Zone').className = 'reaction-zone ' + ($('p2Type').value === 'human' ? 'waiting' : 'disabled');
  $('p2Zone').textContent = $('p2Type').value === 'human' ? 'Waiting...' : 'Autonomous';
  updatePlayerCards();
}

function time() {
  return new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
</script>
</body>
